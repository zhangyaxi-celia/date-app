<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 约会申请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .heart-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        /* Confirmation Page Styles */
        .confirm-container {
            text-align: center;
        }

        .invite-info {
            background: #f8f6ff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .invite-info h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
        }

        .info-value {
            color: #333;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-confirm {
            flex: 2;
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
        }

        .btn-cancel {
            flex: 1;
            background: #f0f0f0;
            color: #666;
        }

        .hidden {
            display: none;
        }

        .success-message {
            text-align: center;
            padding: 40px;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .success-text {
            font-size: 24px;
            color: #4caf50;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .success-sub {
            color: #888;
        }

        .declined-message {
            text-align: center;
            padding: 40px;
        }

        .declined-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .declined-text {
            font-size: 24px;
            color: #ff5252;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* Floating hearts background */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            animation: float 15s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container" id="app">
        <!-- Form Page -->
        <div id="formPage" class="confirm-container">
            <div class="heart-icon">💕</div>
            <h1>约会申请</h1>
            <form id="dateForm">
                <div class="form-group">
                    <label>📅 约会日期</label>
                    <input type="date" id="dateInput" required>
                </div>
                <div class="form-group">
                    <label>⏰ 约会时间</label>
                    <input type="time" id="timeInput" required>
                </div>
                <div class="form-group">
                    <label>📍 约会地点</label>
                    <input type="text" id="locationInput" placeholder="请输入约会地点" required>
                </div>
                <div class="form-group">
                    <label>💝 约会项目</label>
                    <textarea id="activitiesInput" placeholder="请输入想做的事情，比如：吃饭、看电影、逛街..." required></textarea>
                </div>
                <div class="form-group">
                    <label>💬 给ta的话</label>
                    <textarea id="messageInput" placeholder="想说些什么..." style="min-height: 80px;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">💌 发送申请</button>
                <button type="button" class="btn btn-secondary" onclick="showStatusPage()">📋 查看申请状态</button>
            </form>
        </div>

        <!-- Status Page -->
        <div id="statusPage" class="hidden">
            <div class="heart-icon">📋</div>
            <h1>申请状态</h1>
            <div class="invite-info" id="statusInfo">
                <div class="info-item">
                    <span class="info-label">📅 日期</span>
                    <span class="info-value" id="statusDate">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">⏰ 时间</span>
                    <span class="info-value" id="statusTime">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📍 地点</span>
                    <span class="info-value" id="statusLocation">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">💝 项目</span>
                    <span class="info-value" id="statusActivities">-</span>
                </div>
            </div>
            <div id="statusResult"></div>
            <button class="btn btn-primary" onclick="resetForm()">返回创建申请</button>
        </div>

        <!-- Confirmation Page (shown when URL has ?confirm=true) -->
        <div id="confirmPage" class="hidden">
            <div class="heart-icon">💌</div>
            <h1>约会邀请</h1>
            <div class="invite-info">
                <h2>你收到了一份约会邀请</h2>
                <div class="info-item">
                    <span class="info-label">📅 日期</span>
                    <span class="info-value" id="confirmDate">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">⏰ 时间</span>
                    <span class="info-value" id="confirmTime">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📍 地点</span>
                    <span class="info-value" id="confirmLocation">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">💝 项目</span>
                    <span class="info-value" id="confirmActivities">-</span>
                </div>
                <div class="info-item" id="messageRow">
                    <span class="info-label">💬 ta说</span>
                    <span class="info-value" id="confirmMessage">-</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-confirm" onclick="handleConfirm()">✅ 接受邀请</button>
                <button class="btn btn-cancel" onclick="handleCancel()">❌ 残忍拒绝</button>
            </div>
        </div>

        <!-- Success Page -->
        <div id="successPage" class="hidden">
            <div class="success-message">
                <div class="success-icon">🎉</div>
                <div class="success-text">申请已发送！</div>
                <div class="success-sub">等待对方的确认~</div>
                <button class="btn btn-primary" onclick="createNewInvitation()" style="margin-top: 30px;">创建新的申请</button>
            </div>
        </div>

        <!-- Accepted Page -->
        <div id="acceptedPage" class="hidden">
            <div class="success-message">
                <div class="success-icon">💕</div>
                <div class="success-text">已接受邀请！</div>
                <div class="success-sub">期待你们的约会~</div>
            </div>
        </div>

        <!-- Declined Page -->
        <div id="declinedPage" class="hidden">
            <div class="declined-message">
                <div class="declined-icon">😢</div>
                <div class="declined-text">已拒绝邀请</div>
                <div class="success-sub">也许下次吧~</div>
            </div>
        </div>

        <!-- Result Page (shown when ?result=true) -->
        <div id="resultPage" class="hidden">
            <div class="heart-icon">💕</div>
            <h1>申请结果</h1>
            <div class="invite-info">
                <h2>您的约会申请</h2>
                <div class="info-item">
                    <span class="info-label">📅 日期</span>
                    <span class="info-value" id="resultDate">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">⏰ 时间</span>
                    <span class="info-value" id="resultTime">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">📍 地点</span>
                    <span class="info-value" id="resultLocation">-</span>
                </div>
            </div>
            <div id="resultStatus"></div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const isConfirmMode = urlParams.get('confirm') === 'true';
        const isResultMode = urlParams.get('result') === 'true';
        const urlData = urlParams.get('data'); // 编码在URL中的数据

        // Get stored data
        let storedData = localStorage.getItem('dateInvitation');
        let resultData = localStorage.getItem('dateResult');
        let invitationData = storedData ? JSON.parse(storedData) : null;
        let finalResultData = resultData ? JSON.parse(resultData) : null;

        // 如果URL中有编码数据，优先使用（用于分享给其他人）
        if (urlData) {
            try {
                invitationData = JSON.parse(atob(urlData));
            } catch (e) {
                console.error('解析邀请数据失败');
            }
        }

        // Set minimum date to today
        function initDateInput() {
            const dateInput = document.getElementById('dateInput');
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
        }

        // Create floating hearts
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['💕', '💗', '💖', '💘', '💝'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                heart.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(heart);
            }
        }

        // Handle form submission
        document.getElementById('dateForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const dateInput = document.getElementById('dateInput');
            const date = new Date(dateInput.value);
            const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const dateDisplay = `${date.getMonth() + 1}月${date.getDate()}日 ${dayNames[date.getDay()]}`;
            
            const data = {
                date: dateInput.value,
                dateDisplay: dateDisplay,
                time: document.getElementById('timeInput').value,
                location: document.getElementById('locationInput').value,
                activities: document.getElementById('activitiesInput').value,
                message: document.getElementById('messageInput').value,
                status: 'pending'
            };
            
            localStorage.setItem('dateInvitation', JSON.stringify(data));
            
            // Show success page
            document.getElementById('formPage').classList.add('hidden');
            document.getElementById('successPage').classList.remove('hidden');
            
            // Generate shareable link with encoded data
            const encodedData = btoa(JSON.stringify(data));
            const shareUrl = window.location.origin + window.location.pathname + '?confirm=true&data=' + encodedData;
            console.log('分享链接:', shareUrl);
            alert('申请已创建！\n\n分享链接（发送给ta）：\n' + shareUrl);
        });

        // Handle confirmation
        function handleConfirm() {
            // 生成结果链接，申请方打开这个链接可以看到结果
            const resultData = { ...invitationData, status: 'accepted' };
            const encodedResult = btoa(JSON.stringify(resultData));
            const resultUrl = window.location.origin + window.location.pathname + '?result=true&data=' + encodedResult;
            localStorage.setItem('dateResult', JSON.stringify(resultData));
            showPage('acceptedPage');
            alert('已接受！\n\n把这个链接发给你的ta，让他们知道结果：\n' + resultUrl);
        }

        // Handle cancel
        function handleCancel() {
            // 生成结果链接，申请方打开这个链接可以看到结果
            const resultData = { ...invitationData, status: 'declined' };
            const encodedResult = btoa(JSON.stringify(resultData));
            const resultUrl = window.location.origin + window.location.pathname + '?result=true&data=' + encodedResult;
            localStorage.setItem('dateResult', JSON.stringify(resultData));
            showPage('declinedPage');
            alert('已拒绝。\n\n把这个链接发给你的ta，让他们知道结果：\n' + resultUrl);
        }
        
        // Show specific page
        function showPage(pageId) {
            const pages = ['formPage', 'confirmPage', 'successPage', 'acceptedPage', 'declinedPage', 'statusPage', 'resultPage'];
            pages.forEach(page => {
                const el = document.getElementById(page);
                if (el) {
                    el.classList.toggle('hidden', page !== pageId);
                }
            });
        }

        // Show status page
        function showStatusPage() {
            const storedData = localStorage.getItem('dateInvitation');
            if (!storedData) {
                alert('暂无申请记录');
                return;
            }
            
            const data = JSON.parse(storedData);
            document.getElementById('statusDate').textContent = data.dateDisplay;
            document.getElementById('statusTime').textContent = data.time;
            document.getElementById('statusLocation').textContent = data.location;
            document.getElementById('statusActivities').textContent = data.activities;
            
            const statusResult = document.getElementById('statusResult');
            if (data.status === 'accepted') {
                statusResult.innerHTML = '<div class="success-message"><div class="success-icon">💕</div><div class="success-text">对方已接受！</div><div class="success-sub">期待你们的约会~</div></div>';
            } else if (data.status === 'declined') {
                statusResult.innerHTML = '<div class="declined-message"><div class="declined-icon">😢</div><div class="declined-text">对方已拒绝</div><div class="success-sub">也许下次吧~</div></div>';
            } else {
                statusResult.innerHTML = '<div style="text-align:center;padding:20px;color:#888;"><p>⏳ 等待对方确认中...</p><p style="margin-top:10px;font-size:14px;">记得把邀请链接发给ta哦~</p></div>';
            }
            
            showPage('statusPage');
        }

        // Reset form
        function resetForm() {
            document.getElementById('dateForm').reset();
            showPage('formPage');
        }

        function createNewInvitation() {
            localStorage.removeItem('dateInvitation');
            document.getElementById('dateForm').reset();
            showPage('formPage');
        }

        // Initialize
        function init() {
            initDateInput();
            createFloatingHearts();
            
            // 结果页面（申请方通过链接查看对方的选择结果）
            if (isResultMode && urlData) {
                try {
                    const data = JSON.parse(atob(urlData));
                    document.getElementById('resultDate').textContent = data.dateDisplay;
                    document.getElementById('resultTime').textContent = data.time;
                    document.getElementById('resultLocation').textContent = data.location;
                    
                    const resultStatus = document.getElementById('resultStatus');
                    if (data.status === 'accepted') {
                        resultStatus.innerHTML = '<div class="success-message"><div class="success-icon">💕</div><div class="success-text">对方已接受！</div><div class="success-sub">期待你们的约会~</div></div>';
                    } else {
                        resultStatus.innerHTML = '<div class="declined-message"><div class="declined-icon">😢</div><div class="declined-text">对方已拒绝</div><div class="success-sub">也许下次吧~</div></div>';
                    }
                    showPage('resultPage');
                    return;
                } catch (e) {
                    console.error('解析结果数据失败');
                }
            }
            
            if (isConfirmMode && invitationData) {
                // Show confirmation page
                showPage('confirmPage');
                
                // Fill in the data
                document.getElementById('confirmDate').textContent = invitationData.dateDisplay;
                document.getElementById('confirmTime').textContent = invitationData.time;
                document.getElementById('confirmLocation').textContent = invitationData.location;
                document.getElementById('confirmActivities').textContent = invitationData.activities;
                
                const messageRow = document.getElementById('messageRow');
                const confirmMessage = document.getElementById('confirmMessage');
                if (invitationData.message) {
                    confirmMessage.textContent = invitationData.message;
                    messageRow.classList.remove('hidden');
                } else {
                    messageRow.classList.add('hidden');
                }
                
                // Check if already responded
                if (invitationData.status === 'accepted') {
                    showPage('acceptedPage');
                } else if (invitationData.status === 'declined') {
                    showPage('declinedPage');
                }
            }
        }

        init();
    </script>
</body>
</html>
